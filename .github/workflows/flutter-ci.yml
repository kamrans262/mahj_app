name: Flutter CI

on:
  push:
    branches:
      - milestone/01-auth-account

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Format
        run: dart format lib test

      - name: Commit formatter output
        run: |
          if ! git diff --quiet -- lib test pubspec.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib test pubspec.lock
            git commit -m "style: format auth milestone"
            git push
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
